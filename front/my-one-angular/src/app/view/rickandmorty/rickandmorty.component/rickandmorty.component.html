

<div class="row g-3">
@for (Rick of rickandmortyCharacters; track Rick.id) {
    <div class="col-12 col-sm-6 col-lg-3">
            <div class="card" style="width: 18rem">
                <div class="card-body" >
                    <h5 class="card-title">{{Rick.id}}</h5>
                    <h6 class="card-subtitle mb-2 text-body-secondary">{{Rick.name}}</h6>
                    <h6 class="card-subtitle mb-2 text-body-secondary">{{Rick.status}}</h6>
                    <h6 class="card-subtitle mb-2 text-body-secondary">{{Rick.species}}</h6>
                    <h6 class="card-subtitle mb-2 text-body-secondary">{{Rick.gender}}</h6>
                    <img src="{{Rick.image}}" alt=" " width="200px" height="150px">
                    <p class="card-text">
                      {{Rick.origin.name}}
                    </p>
                    
                </div>
            </div>
        </div>
        
}
</div>
